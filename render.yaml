# Despliegue GRATUITO en Render conectado a la base de datos de Supabase.
# - Plan free (sin disco): los documentos se guardan en PostgreSQL (STORAGE_DRIVER=database).
# - El plan free se suspende por inactividad: pg_cron de Supabase llama a /api/internal/tick
#   cada 5 minutos, lo que mantiene el servicio activo y ejecuta el motor de reglas.
services:
  - type: web
    name: centro-inteligente-monitoreo
    runtime: docker
    plan: free
    region: ohio
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL          # Supabase → Connect → Session pooler (puerto 5432)
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CRON_SECRET           # el mismo valor se configura en el job de pg_cron
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: RUN_SCHEDULER
        value: "true"
      - key: STORAGE_DRIVER
        value: database
      - key: NODE_ENV
        value: production
